syntax = "proto3";

package voting;

service VotingService {
  rpc CastVote (VoteRequest) returns (VoteResponse);
  rpc StartElection (ElectionRequest) returns (ElectionResponse);
  rpc ReplicateState (ReplicationRequest) returns (ReplicationResponse);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
}

message VoteRequest {
  int32 voter_id = 1;
  int32 candidate_id = 2;
  int64 lamport_timestamp = 3;
}

message VoteResponse {
  bool success = 1;
  string message = 2;
}

message ElectionRequest {
  int32 sender_id = 1;
}

message ElectionResponse {
  bool success = 1;
}

message ReplicationRequest {
  int32 voter_id = 1;
  int32 candidate_id = 2;
  int64 lamport_timestamp = 3;
}

message ReplicationResponse {
  bool success = 1;
}

message HeartbeatRequest {
  int32 leader_id = 1;
  int64 lamport_timestamp = 2;
}

message HeartbeatResponse {
  bool acknowledged = 1;
}

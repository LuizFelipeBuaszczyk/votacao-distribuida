syntax = "proto3";
package voting;

service VotingService {
  rpc CastVote (VoteRequest) returns (VoteResponse);
  rpc GetResults (ResultsRequest) returns (ResultsResponse);
  rpc StartElection (ElectionRequest) returns (ElectionResponse);
  rpc ReplicateState (ReplicationRequest) returns (ReplicationResponse);
  rpc SyncState (SyncRequest) returns (SyncResponse);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
  rpc DeclareCoordinator (CoordinatorMessage) returns (CoordinatorResponse);
}

message VoteRequest {
  int32 voter_id = 1;
  int32 candidate_id = 2;
  int64 lamport_timestamp = 3;
}

message VoteResponse {
  bool success = 1;
  string message = 2;
  bool retry = 3;
  int32 leader_id = 4;
}

message ResultsRequest {}

message CandidateResult {
  int32 candidate_id = 1;
  int64 votes = 2;
}

// Visão local de um nó: consultar os três mostra o estado da replicação
message ResultsResponse {
  int32 node_id = 1;
  int32 leader_id = 2;
  bool accepting_votes = 3;
  int64 total_votes = 4;
  repeated CandidateResult results = 5;
}

message ElectionRequest {
  int32 sender_id = 1;
}

message ElectionResponse {
  bool success = 1;
}

message ReplicationRequest {
  int32 voter_id = 1;
  int32 candidate_id = 2;
  int64 lamport_timestamp = 3;
}

message ReplicationResponse {
  bool success = 1;
}

message VoteRecord {
  int32 voter_id = 1;
  int32 candidate_id = 2;
  int64 lamport_timestamp = 3;
}

message SyncRequest {
  int32 sender_id = 1;
  repeated VoteRecord votes = 2;
}

message SyncResponse {
  repeated VoteRecord votes = 1;
}

message HeartbeatRequest {
  int32 leader_id = 1;
  int64 lamport_timestamp = 2;
}

message HeartbeatResponse {
  bool acknowledged = 1;
  int64 vote_count = 2;
}

message CoordinatorMessage {
  int32 new_leader_id = 1;
}

message CoordinatorResponse {
  bool acknowledged = 1;
}
